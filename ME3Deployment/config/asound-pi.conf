# Isolated ALSA routes for the inspected Pi. ALSA_CONFIG_PATH applies per process.
</usr/share/alsa/alsa.conf>
pcm.me3_mic {
    type plug
    slave.pcm "hw:CARD=Device,DEV=0"
    hint {
        show on
        description "ME3 USB microphone with rate conversion"
    }
}
pcm.me3_speaker {
    type plug
    slave.pcm "hw:CARD=vc4hdmi0,DEV=0"
    hint {
        show on
        description "ME3 HDMI0 monitor speaker with format conversion"
    }
}
